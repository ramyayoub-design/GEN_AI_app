<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAT DREAM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050505; font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; }

  /* ---------- AMBIENT LAYER : glow dots + neon streaks ---------- */
  #ambient { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .dot {
    position: absolute; border-radius: 50%;
    animation: dotPulse var(--d, 3s) ease-in-out var(--delay, 0s) infinite;
  }
  @keyframes dotPulse { 0%, 100% { opacity: .05; } 50% { opacity: 1; } }

  /* speed mode: dots stretch into motion blur, vertical streaks rain down */
  .vstreak {
    position: absolute; top: -32vh; width: 2px; height: 26vh;
    background: linear-gradient(180deg, transparent, var(--c, #fff));
    filter: blur(1px);
    animation: vfall var(--d, .7s) linear var(--delay, 0s) infinite;
  }
  @keyframes vfall { to { transform: translateY(175vh); } }

  /* ---------- SCATTERED NEON SIGNS ---------- */
  .scatter {
    position: fixed; z-index: 2; pointer-events: none;
    transform: rotate(var(--r, 0deg));
    animation: neonFlicker var(--fd, 5s) steps(1) var(--delay, 0s) infinite;
  }
  .scatter img { height: 100%; width: auto; display: block; mix-blend-mode: screen; }
  @keyframes neonFlicker {
    0%, 100% { filter: brightness(1); }
    7%  { filter: brightness(.45); }
    8%  { filter: brightness(1.15); }
    9%  { filter: brightness(.7); }
    10% { filter: brightness(1); }
    54% { filter: brightness(1); }
    55% { filter: brightness(.5); }
    56% { filter: brightness(1.1); }
  }
  #sgDreamshed  { left: 1.5vw;  bottom: 3vh;  height: 60vh; --r: -2.5deg; --fd: 7s;   --delay: .8s; }
  #sgStack      { right: 2vw;   bottom: 4vh;  height: 58vh; --r: 2deg;    --fd: 6s;   --delay: 2.1s; }
  #sgVegas      { left: 16vw;   top: -2vh;    height: 46vh; --r: -7deg;   --fd: 5.2s; --delay: 0s; }
  #sgBillboards { right: 17vw;  top: -3vh;    height: 47vh; --r: 4deg;    --fd: 8s;   --delay: 3s; }
  #sgStar       { right: 36vw;  top: 4vh;     height: 34vh; --r: 9deg;    --fd: 4.4s; --delay: 1.4s; }

  .fadeable { transition: opacity .55s ease; }
  body.morphing .fadeable { opacity: 0 !important; }

  /* ---------- CENTER SIGN BLOCK ---------- */
  #center {
    position: fixed; left: 50%; top: 47%; transform: translate(-50%, -50%);
    z-index: 5; text-align: center; width: min(58vw, 720px);
  }
  #bulbs { display: flex; justify-content: center; gap: 11px; margin-bottom: 12px; }
  #bulbs span {
    width: 10px; height: 10px; border-radius: 50%;
    animation: bulb 1s steps(1) infinite;
  }
  #bulbs span:nth-child(odd)  { background: #ffd34d; box-shadow: 0 0 9px 2px #ffd34d; }
  #bulbs span:nth-child(even) { background: #ff4d4d; box-shadow: 0 0 9px 2px #ff4d4d; animation-delay: .5s; }
  @keyframes bulb { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }

  #persp {
    perspective: 700px;
    perspective-origin: 50% 35%;
  }
  #sign {
    width: 100%; aspect-ratio: 1890 / 770; cursor: pointer;
    background-image: url('data/LLV/center sign/04.png');
    background-size: 100% auto; background-position: center top;
    border: 3px solid #1c1c1c; box-shadow: 0 0 26px rgba(120, 140, 255, .14);
    transform-origin: 50% 100%; position: relative;
    overflow: hidden;
  }
  body.morphing #center {
    animation: centerMoveToRoad 1.25s cubic-bezier(.55, 0, .25, 1) forwards;
  }

  body.morphing #sign {
    animation: signTiltToRoad 1.25s cubic-bezier(.55, 0, .25, 1) forwards;
    transform-origin: 50% 100%;
  }

  @keyframes centerMoveToRoad {
    from {
      top: 47%;
      transform: translate(-50%, -50%);
    }

    to {
      top: 61%;
      transform: translate(-50%, -50%);
    }
  }

  @keyframes signTiltToRoad {
    from {
      transform: rotateX(0deg) rotateZ(0deg) scale(1);
    }

    to {
      transform: rotateX(68deg) rotateZ(0deg) scale(0.72);
    }
  }

  #sign::before,
  #sign::after {
    content: "TEXT TO IMAGE · IMAGE TO IMAGE · MULTI REFERENCE · MAGAZINE BUILDER · 3D GENERATION · TORZEV LORA · FLAT DREAM · ";
    position: absolute;
    left: -100%;
    width: 300%;
    height: 18px;
    background: #c0392b;
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    line-height: 18px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    animation: roadTickerMove 1.1s linear infinite;
  }

  #sign::before {
    top: 10px;
    transform: translateX(0) rotateZ(0deg);
  }

  #sign::after {
    bottom: 10px;
    transform: translateX(0) rotateZ(0deg);
    animation-direction: reverse;
  }

  body.driving #sign::before,
  body.driving #sign::after {
    opacity: 1;
  }

  @keyframes roadTickerMove {
    from { transform: translateX(0); }
    to { transform: translateX(33%); }
  }

  #bars { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
  #bars span { width: 64px; height: 9px; }
  #bars span:nth-child(1) { background: #c0392b; }
  #bars span:nth-child(2) { background: #1f4fd8; }
  #bars span:nth-child(3) { background: #f2c200; }

  #ticker {
    margin-top: 6px; background: #c0392b; overflow: hidden; height: 20px;
  }
  #ticker .tk {
    display: inline-block; white-space: nowrap;
    animation: marquee 16s linear infinite;
    font-size: 10px; font-weight: 900; letter-spacing: 1px;
    line-height: 20px; color: #fff;
  }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  #hint {
    margin-top: 20px; font-size: 12px; letter-spacing: 4px; color: #9a9a9a;
    animation: bulb 1.6s steps(1) infinite;
  }


  /* ---------- CLONED SIGN TRANSITION LAYER ---------- */
  #transitionLayer {
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    overflow: hidden;
    perspective: 900px;
    perspective-origin: 50% 50%;
  }
  .road-sign-clone {
    position: fixed;
    background-image: url('data/LLV/center sign/04.png');
    background-size: 100% 100%;
    background-position: center center;
    background-repeat: no-repeat;
    border: 3px solid #1c1c1c;
    box-shadow: 0 0 26px rgba(120, 140, 255, .14);
    overflow: hidden;
    transform-origin: 50% 50%;
    transform-style: preserve-3d;
    will-change: left, top, width, height, transform;
    transition:
      left 1.35s cubic-bezier(.45,0,.18,1),
      top 1.35s cubic-bezier(.45,0,.18,1),
      width 1.35s cubic-bezier(.45,0,.18,1),
      height 1.35s cubic-bezier(.45,0,.18,1),
      transform 1.35s cubic-bezier(.45,0,.18,1),
      box-shadow 1.35s ease;
    z-index: 5;
  }

  .road-sign-clone.to-road {
    box-shadow: 0 36px 70px rgba(0,0,0,.65), 0 0 32px rgba(226,75,74,.22);
  }

  .road-edge-ticker {
    position: absolute;
    left: -100%;
    width: 300%;
    height: 18px;
    background: #c0392b;
    color: #fff;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 1.5px;
    line-height: 18px;
    white-space: nowrap;
    opacity: .96;
    animation: roadTickerMove .75s linear infinite;
    text-shadow: 0 0 6px rgba(255,255,255,.45);
  }

  .road-edge-ticker.top { top: 8px; }
  .road-edge-ticker.bottom { bottom: 8px; animation-direction: reverse; }

  /* ---------- DRIVE SCENE ---------- */
  #car {
    position: fixed;
    left: 50%;
    top: 63%;
    transform: translate(-50%, -50%) scale(1);
    width: min(10vw, 120px);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    mix-blend-mode: normal;
    will-change: left, top, transform, opacity;
  }

  @media (prefers-reduced-motion: reduce) {
    .dot, .streak, .vstreak, #bulbs span, #hint, .scatter { animation: none !important; }
  }
</style>
</head>
<body>

<div id="ambient"></div>

<div class="scatter fadeable" id="sgDreamshed"><img src="data/LLV/s3.png" alt=""></div>
<div class="scatter fadeable" id="sgStack"><img src="data/LLV/s4.png" alt=""></div>
<div class="scatter fadeable" id="sgVegas"><img src="data/LLV/s1.png" alt=""></div>
<div class="scatter fadeable" id="sgBillboards"><img src="data/LLV/s5.png" alt=""></div>
<div class="scatter fadeable" id="sgStar"><img src="data/LLV/s2.png" alt=""></div>

<div id="center">
  <div id="bulbs" class="fadeable">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>
  <div id="persp">
    <div id="sign" title="Enter FlatDream">
      <div class="edge l"></div>
      <div class="edge r"></div>
    </div>
  </div>
  <div id="bars" class="fadeable"><span></span><span></span><span></span></div>
  <div id="ticker" class="fadeable"><div class="tk" id="tickerText"></div></div>
  <div id="hint" class="fadeable">CLICK TO ENTER</div>
</div>

<img id="car" src="data/LLV/car.png" alt="">

<script>
  var TICKER = 'ARCHIGRAM INTERFACE · IAAC GENAI 2026 · RAMY AYOUB · TUE MINH · ▶ FLATDREAM · TORZEV LORA · TEXT TO IMAGE · IMAGE TO IMAGE · MULTI REFERENCE · MAGAZINE BUILDER · 3D GENERATION · ';
  document.getElementById('tickerText').textContent = TICKER + TICKER + TICKER + TICKER;

  var COLORS = ['data/LLV/center sign/04.png'];
  var sign = document.getElementById('sign');
  sign.style.backgroundImage = "url('" + COLORS[0] + "')";

  /* ---- ambient dots ---- */
  var ambient = document.getElementById('ambient');
  var PALETTE = ['#ffd34d', '#ff4d4d', '#4da6ff', '#c44dff', '#ffffff'];
  for (var i = 0; i < 100; i++) {
    var d = document.createElement('span');
    d.className = 'dot';
    var size = 3 + Math.random() * 5;
    var col = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    d.style.cssText =
      'left:' + (Math.random() * 100) + 'vw;' +
      'top:' + (Math.random() * 100) + 'vh;' +
      'width:' + size + 'px;' +
      'height:' + size + 'px;' +
      'background:' + col + ';' +
      'box-shadow:0 0 ' + (size * 6) + 'px ' + (size * 1.8) + 'px ' + col + ';' +
      '--d:' + (0.6 + Math.random() * 1.2) + 's;' +
      '--delay:' + (Math.random() * 3) + 's;';
    ambient.appendChild(d);
  }

  /* ---- THE MORPH : clone the sign into a temporary 3D road layer ---- */
  var morphed = false;

  function accelerateDots() {
    var dots = document.querySelectorAll('.dot');
    dots.forEach(function(dot) {
      dot.style.setProperty('--d', '0.12s');
      dot.style.filter = 'brightness(1.9)';
    });
  }

  function buildTransitionLayer() {
    var layer = document.createElement('div');
    layer.id = 'transitionLayer';

    // No interface preview here. The real interface appears only after redirect.
    document.body.appendChild(layer);

    return layer;
  }

  function cloneSignIntoRoad(layer) {
    var rect = sign.getBoundingClientRect();
    var clone = document.createElement('div');
    clone.className = 'road-sign-clone';

    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.transform = 'translate3d(0,0,0) rotateX(0deg) scale(1)';

    var tickerText = ' TEXT TO IMAGE · IMAGE TO IMAGE · MULTI REFERENCE · MAGAZINE BUILDER · 3D GENERATION · TORZEV LORA · FLAT DREAM · ';
    var topTicker = document.createElement('div');
    topTicker.className = 'road-edge-ticker top';
    topTicker.textContent = tickerText + tickerText + tickerText;

    var bottomTicker = document.createElement('div');
    bottomTicker.className = 'road-edge-ticker bottom';
    bottomTicker.textContent = tickerText + tickerText + tickerText;

    clone.appendChild(topTicker);
    clone.appendChild(bottomTicker);
    layer.appendChild(clone);

    // Hide only the original center block after the clone is in the exact same place.
    document.getElementById('center').style.opacity = '0';

    return clone;
  }

  function animateSignToRoad(clone) {
    var vw = window.innerWidth;

    var targetW = Math.min(vw * 0.54, 800);
    var targetH = targetW * (770 / 1890);

    requestAnimationFrame(function () {
      clone.classList.add('to-road');
      clone.style.left = '50%';
      clone.style.top = '50%';
      clone.style.width = targetW + 'px';
      clone.style.height = targetH + 'px';

      // Keep the sign in the middle. It stays tilted, but no longer drops to the bottom.
      clone.style.transform = 'translate3d(-50%, -50%, 0) perspective(900px) rotateX(63deg) scale(0.92)';
    });
  }

  function driveCarOnRoad(clone) {
    var car = document.getElementById('car');

    // Read the tilted sign's screen box after it has finished moving.
    var roadRect = clone.getBoundingClientRect();

    // Side-view car: left-to-right movement across the center sign.
    var startX = roadRect.left + roadRect.width * 0.08;
    var endX = roadRect.left + roadRect.width * 0.92;
    var driveY = roadRect.top + roadRect.height * 0.54;

    car.style.transition = 'none';
    car.style.left = startX + 'px';
    car.style.top = driveY + 'px';
    car.style.width = Math.min(window.innerWidth * 0.12, 180) + 'px';
    car.style.transform = 'translate(-50%, -50%) scale(1)';
    car.style.opacity = '0';

    requestAnimationFrame(function () {
      car.style.transition = 'opacity .22s ease';
      car.style.opacity = '1';
    });

    setTimeout(function () {
      car.style.transition = 'left 2.35s cubic-bezier(.25,0,.45,1), transform 2.35s cubic-bezier(.25,0,.45,1), opacity .45s ease 1.9s';
      car.style.left = endX + 'px';
      car.style.top = driveY + 'px';
      car.style.transform = 'translate(-50%, -50%) scale(0.92)';
      car.style.opacity = '0';
    }, 250);
  }


  sign.addEventListener('click', function () {
    if (morphed) return;
    morphed = true;

    accelerateDots();

    var layer = buildTransitionLayer();
    var roadClone = cloneSignIntoRoad(layer);

    // Fade out small center helpers only. Do not move the original sign layout.
    ['bulbs', 'bars', 'ticker', 'hint'].forEach(function(id){
      var el = document.getElementById(id);
      if (el) el.style.opacity = '0';
    });

    setTimeout(function () {
      animateSignToRoad(roadClone);
    }, 40);

    setTimeout(function () {
      driveCarOnRoad(roadClone);
    }, 1450);

    // Open the actual interface only after the car has finished crossing the sign.
    setTimeout(function () {
      window.location.href = 'interface.html';
    }, 3000);
  });
</script>
</body>
</html>
